name: Release

# Läuft automatisch, sobald eine Versionsmarke (Tag) wie "v1.0.0" hochgeladen wird,
# und erstellt daraus das Release mit module.json und module.zip.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version und Links in module.json eintragen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg man "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg dl  "https://github.com/$REPO/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version=$v | .url=$url | .manifest=$man | .download=$dl' module.json > tmp.json
          mv tmp.json module.json

      - name: Modul packen
        run: zip -r module.zip module.json scripts styles README.md

      - name: Dateien an das Release hängen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
