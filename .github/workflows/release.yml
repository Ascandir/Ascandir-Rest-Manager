name: Release

# Neue Version veröffentlichen:
#   GitHub → Reiter "Actions" → links "Release" → "Run workflow" → Versionsnummer eintragen (z. B. 1.0.0) → grüner Knopf.
# Alternativ läuft es auch, wenn auf GitHub von Hand ein Release veröffentlicht wird.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer, z. B. 1.0.0"
        required: true
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Version und Links in module.json eintragen
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ steps.v.outputs.tag }}"
          jq --arg v "${{ steps.v.outputs.version }}" \
             --arg url "https://github.com/$REPO" \
             --arg man "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg dl  "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version=$v | .url=$url | .manifest=$man | .download=$dl' module.json > tmp.json
          mv tmp.json module.json

      - name: Modul packen
        run: zip -r module.zip module.json scripts styles assets fonts README.md

      - name: Release erstellen und Dateien anhängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          make_latest: true
          files: |
            module.json
            module.zip
